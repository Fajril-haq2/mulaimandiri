name: Video kucing quote -> Buffer

on:
  schedule:
    # 01:30 UTC = 08:30 WIB: render + unggah + jadwalkan ke Buffer untuk tayang HARI ITU jam 17:00 WIB.
    # (daily.yml tetap jalan 08:00 WIB dan tayang 19:00 lewat antrean. Tidak diubah sama sekali.)
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "Tes: paksa konten hari ke-N (1-30). Kosongkan = otomatis sesuai tanggal."
        required: false
      post:
        description: "Tes: kirim ke Buffer juga? (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: daily-post          # sama dengan daily.yml supaya tidak jalan bersamaan
  cancel-in-progress: false

jobs:
  cat:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pasang ffmpeg dan dependensi gambar
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg libcairo2-dev pkg-config python3-dev
          pip install -r catvideo/requirements.txt

      - name: Render video hari ini
        id: render
        env:
          START_DATE: ${{ vars.CAT_START_DATE }}
          WEEKDAYS: ${{ vars.CAT_WEEKDAYS || '1,2,3,4,5,6,7' }}
          FORCE_DAY: ${{ github.event.inputs.day }}
        run: |
          if [ -n "$FORCE_DAY" ]; then
            python catvideo/build_video.py --day "$FORCE_DAY" --out catvideo/out
          else
            TODAY=$(TZ=Asia/Jakarta date +%F)
            python catvideo/build_video.py --date "$TODAY" --start "$START_DATE" --weekdays "$WEEKDAYS" --out catvideo/out
          fi

      - name: Putuskan kirim atau tidak
        id: gate
        env:
          SKIP: ${{ steps.render.outputs.skip }}
          EVENT: ${{ github.event_name }}
          POST: ${{ github.event.inputs.post }}
        run: |
          if [ "$SKIP" != "true" ] && { [ "$EVENT" = "schedule" ] || [ "$POST" = "true" ]; }; then
            echo "post=true" >> "$GITHUB_OUTPUT"
          else
            echo "post=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Simpan hasil render (bisa diunduh untuk dicek)
        if: ${{ steps.render.outputs.skip != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: video-kucing
          path: catvideo/out/*
          retention-days: 14

      - name: Siapkan media publik
        if: ${{ steps.gate.outputs.post == 'true' }}
        run: |
          D=$(TZ=Asia/Jakarta date +%Y%m%d)
          NAME=cat_day$(printf %02d "${{ steps.render.outputs.day }}")
          mkdir -p site/$D && cp "${{ steps.render.outputs.video }}" "site/$D/$NAME.mp4"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "MEDIA_BASE_URL=https://$OWNER.github.io/${{ github.event.repository.name }}/$D" >> $GITHUB_ENV
          echo "CAT_NAME=$NAME" >> $GITHUB_ENV

      - name: Unggah ke GitHub Pages (file lama dipertahankan)
        if: ${{ steps.gate.outputs.post == 'true' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          keep_files: true

      - name: Jadwalkan ke Buffer (jam 17.00 WIB)
        if: ${{ steps.gate.outputs.post == 'true' }}
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          CAPTION_FILE: ${{ steps.render.outputs.caption_file }}
          CAT_POST_TIME: ${{ vars.CAT_POST_TIME || '17:00' }}   # jam tayang WIB
        run: python catvideo/post_cat.py --name "$CAT_NAME" --caption-file "$CAPTION_FILE"

      - name: Simpan log video kucing ke repo
        if: ${{ always() && steps.gate.outputs.post == 'true' }}
        run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add catvideo/posted_log.txt || true
          git commit -m "log video kucing" || echo "tidak ada perubahan"
          git pull --rebase || true
          git push || true
